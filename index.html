<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Called2Serve</title>
    <meta
      name="description"
      content="A playful LDS mission personality quiz for GitHub Pages."
    >
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="language-switcher">
      <label class="sr-only" for="language-select">Language</label>
      <select id="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
      </select>
    </div>

    <main class="app-shell">
      <section class="hero" aria-labelledby="app-title">
        <div>
          <p class="eyebrow" data-i18n="brand">Called2Serve</p>
          <h1 id="app-title" data-i18n="heroTitle">Where will you serve?</h1>
          <p class="lede" data-i18n="heroLede">
            Answer a few deeply unserious questions and receive a very unofficial
            mission call.
          </p>
        </div>
        <div class="seal" aria-hidden="true">
          <span>CTR</span>
        </div>
      </section>

      <section class="quiz-panel" aria-live="polite">
        <div id="app" class="app-state">
          <p class="loading" data-i18n="loading">Loading mission papers...</p>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
